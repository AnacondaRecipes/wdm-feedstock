{% set name = "wdm" %}
{% set version = "0.2.6" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://github.com/tnagler/{{ name }}/archive/refs/tags/v{{ version }}.tar.gz
  sha256: 377b4c72ee204f7d440fbd7c1da983bc3f0002ec17265c6bcde233eb3c92a483

build:
  number: 0

requirements:
  build:
    - {{ compiler('cxx') }}
    - cmake
    - ninja

test:
  requires:
    - {{ compiler('cxx') }}
  source_files:
    - test

about:
  home: https://github.com/tnagler/wdm
  license: MIT
  license_file: LICENSE
  license_family: MIT
  summary: |
    A header-only C++ library for weighted dependence measures.
  description: |
    A header-only C++ library for weighted dependence measures
  doc_url: https://tnagler.github.io/wdm
  dev_url: https://github.com/tnagler/wdm

extra:
  recipe-maintainers:
    - lorepirri
